spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://host.docker.internal:5432/demo_flyway}
    username: postgres
    password: hieu
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  frontend:
    url: ${FRONTEND_URL:http://localhost:31004/}

  profiles:
    default: local


server:
  port: 8099

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0